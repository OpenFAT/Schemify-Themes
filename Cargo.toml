[package]
name = "schemify-themes"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]   # cdylib: the guest; rlib: native tests

[workspace]
resolver = "3"

[dependencies]
schemify-abi = { git = "https://github.com/OpenFAT/Schemify", rev = "af2be42c94cc983e10d7ebfee0f0a766c09adb1b", features = ["guest"] }

# Small modules: size over speed, no unwinding (a panic is a trap the host reports).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
